<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Proyectos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <div class="logo">Mi Portafolio</div>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#proyectos">Proyectos</a>
            <a href="#contacto">Contacto</a>
        </nav>

        <div class="controles-usuario">
            <button id="btn-toggle-tema" class="btn-tema">🌙 Cambiar Tema</button>
        </div>
    </header>

    <!-- Contenido principal -->
    <main>
        

        <!-- Sección Hero / Portada -->
        <section id="inicio" class="hero">

            <img src="img/Portada.jpg" alt="Imagen de portada">

            <h1>Bienvenido a mi portafolio</h1>
            <!-- Contenedor vacío donde JS inyectará el saludo según la hora -->
            <p id="saludo-tiempo-real" class="texto-resaltado"></p>
            <p>Conoce mis proyectos y trabajos realizados.</p>
            <button>Ver proyectos</button>

        </section>

        <!-- Sección Proyectos -->
        <section id="proyectos">
            <h2>Mis proyectos</h2>

            <div class="proyectos-grid">

                <article>
                    <img src="img/proyecto1.jpg" alt="Proyecto 1">
                    <h3>Proyecto 1</h3>
                    <p>Descripción de mi primer proyecto.</p>
                </article>

                <article>
                    <img src="img/proyecto2.jpg" alt="Proyecto 2">
                    <h3>Proyecto 2</h3>
                    <p>Descripción de mi segundo proyecto.</p>
                </article>

                <article>
                    <img src="img/proyecto3.jpg" alt="Proyecto 3">
                    <h3>Proyecto 3</h3>
                    <p>Descripción de mi tercer proyecto.</p>
                </article>

            </div>
        </section>

    </main>

    <script src="js/app.js" defer></script>

</body>
</html>
